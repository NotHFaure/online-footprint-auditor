[project]
name = "online-footprint-auditor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click",
    "httpx",
    "platformdirs",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
